services:
  # ============================================
  # PostgreSQL Database
  # ============================================
  postgres:
    image: postgres:16-alpine
    container_name: prowallet-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-prowallet}
      POSTGRES_USER: ${POSTGRES_USER:-prowallet}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # ⚠️ SECURITY: Do NOT expose database port to internet
    # ports:
    #   - "5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prowallet-network

  # ============================================
  # Redis Cache
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: prowallet-redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    # ⚠️ SECURITY: Do NOT expose redis port to internet
    # ports:
    #   - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - prowallet-network

  # ============================================
  # Frontend (Next.js)
  # ============================================
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.web
      args:
        NEXT_PUBLIC_ENVIRONMENT: ${NEXT_PUBLIC_ENVIRONMENT:-local}
        NEXT_PUBLIC_API_URL_LOCAL: ${NEXT_PUBLIC_API_URL_LOCAL:-http://localhost:3005/api/v1}
        NEXT_PUBLIC_API_URL_CLOUD: ${NEXT_PUBLIC_API_URL_CLOUD:-https://servicioshilda.orioncaribe.com/api/v1}
        NEXT_PUBLIC_SOLANA_NETWORK: ${NEXT_PUBLIC_SOLANA_NETWORK:-devnet}
        NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_FALLBACK_SOLANA_RPC_URL: ${NEXT_PUBLIC_FALLBACK_SOLANA_RPC_URL:-https://api.devnet.solana.com}
        NEXT_PUBLIC_HELIUS_API_KEY: ${NEXT_PUBLIC_HELIUS_API_KEY:-}
        NEXT_PUBLIC_PROWALLET_PROGRAM_ID: ${NEXT_PUBLIC_PROWALLET_PROGRAM_ID:-}
        NEXT_PUBLIC_TOKEN_MINT: ${NEXT_PUBLIC_TOKEN_MINT:-}
    container_name: prowallet-web
    depends_on:
      - api
    environment:
      # Environment declaration
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
      PORT: 3000

      # ENVIRONMENT CONFIGURATION
      NEXT_PUBLIC_ENVIRONMENT: production

      # Solana mainnet config (Helius RPC)
      NEXT_PUBLIC_SOLANA_NETWORK: mainnet-beta
      NEXT_PUBLIC_SOLANA_RPC_URL: ${NEXT_PUBLIC_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_FALLBACK_SOLANA_RPC_URL: ${NEXT_PUBLIC_FALLBACK_SOLANA_RPC_URL:-https://api.devnet.solana.com}
      NEXT_PUBLIC_PROWALLET_PROGRAM_ID: 7sa2XazRU4R6DcsNLGMWcX4nabCzWwjj3Awfh1gxhtem

      # Helius API endpoints (for frontend transaction parsing)
      NEXT_PUBLIC_HELIUS_API_KEY: ${NEXT_PUBLIC_HELIUS_API_KEY:-}
      NEXT_PUBLIC_HELIUS_PARSE_TRANSACTION_URL: ${NEXT_PUBLIC_HELIUS_PARSE_TRANSACTION_URL:-}
      NEXT_PUBLIC_HELIUS_PARSE_HISTORY_URL: ${NEXT_PUBLIC_HELIUS_PARSE_HISTORY_URL:-}

      # Token config (public - from local development)
      NEXT_PUBLIC_TOKEN_MINT: D8TwbwGGmyucrxPB9uscait27caVgeqYHPpyN3XXjUX3
      NEXT_PUBLIC_TOKEN_NAME: ProWallet
      NEXT_PUBLIC_TOKEN_SYMBOL: GAPC
      NEXT_PUBLIC_TEST_MODE_FREE_TOKEN: "false"

      # API config - tells frontend where to call the backend API
      NEXT_PUBLIC_API_URL_LOCAL: ${NEXT_PUBLIC_API_URL_LOCAL:-http://localhost:3005/api/v1}
      NEXT_PUBLIC_API_URL_CLOUD: ${NEXT_PUBLIC_API_URL_CLOUD:-https://servicioshilda.orioncaribe.com/api/v1}
    ports:
      - "3006:3000"
    networks:
      - prowallet-network
    restart: unless-stopped

  # ============================================
  # Backend API (Express / tRPC / Nest)
  # ============================================
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile.api
    container_name: prowallet-api
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Server Configuration
      NODE_ENV: production
      PORT: 3001

      # Database connection string - REQUIRED
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env.docker}

      # ============================================================================
      # SOLANA NETWORK CONFIGURATION
      # ============================================================================
      SOLANA_NETWORK: mainnet-beta
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-https://api.devnet.solana.com}
      FALLBACK_SOLANA_RPC_URL: ${FALLBACK_SOLANA_RPC_URL:-https://api.devnet.solana.com}

      # ============================================================================
      # HELIUS API ENDPOINTS (for parsing transactions)
      # ============================================================================
      HELIUS_API_KEY: ${HELIUS_API_KEY:?Set HELIUS_API_KEY in .env.docker}
      HELIUS_PARSE_TRANSACTION_URL: "https://api-mainnet.helius-rpc.com/v0/transactions/?api-key=${HELIUS_API_KEY:?Set HELIUS_API_KEY in .env.docker}"
      HELIUS_PARSE_HISTORY_URL: "https://api-mainnet.helius-rpc.com/v0/addresses/{address}/transactions/?api-key=${HELIUS_API_KEY:?Set HELIUS_API_KEY in .env.docker}"

      # ============================================================================
      # TOKEN CONFIGURATION
      # ============================================================================
      TOKEN_MINT: D8TwbwGGmyucrxPB9uscait27caVgeqYHPpyN3XXjUX3
      TOKEN_NAME: ProWallet
      TOKEN_SYMBOL: GAPC
      TOKEN_DECIMALS: 9
      MAX_SUPPLY: 1000000000
      BASE_TOKEN_PRICE: "0.01"

      # ============================================================================
      # BONDING CURVE & PRICING
      # ============================================================================
      BONDING_CURVE_MULTIPLIER: "1.5"
      PRICING_MODE: bonding

      # ============================================================================
      # GAS & PLATFORM FEES
      # ============================================================================
      GAS_ESTIMATE_SOL: "0.000005"
      PLATFORM_COMMISSION_SOL: "0.000005"

      # ============================================================================
      # WALLETS & AUTHORITIES (PUBLIC KEYS - safe to hardcode)
      # ============================================================================
      PROVIDER_PUBLIC_KEY: EizJ7W8AbhUAPdSjdEjyKJDEmk7MSJnR6JfH2h2gitLH
      PROVIDER_ATA: DuVzGwE9waTmPHjsto3brPbFZaqMjW5AnDQEA1mK1ZZN
      COMPANY_WALLET: EizJ7W8AbhUAPdSjdEjyKJDEmk7MSJnR6JfH2h2gitLH
      COMMISSION_WALLET: EizJ7W8AbhUAPdSjdEjyKJDEmk7MSJnR6JfH2h2gitLH
      AUTHORITY_WALLET: EizJ7W8AbhUAPdSjdEjyKJDEmk7MSJnR6JfH2h2gitLH
      TOKEN_ACCOUNT: DuVzGwE9waTmPHjsto3brPbFZaqMjW5AnDQEA1mK1ZZN
      TREASURY_WALLET: EizJ7W8AbhUAPdSjdEjyKJDEmk7MSJnR6JfH2h2gitLH

      # ============================================================================
      # SIGNING CREDENTIALS (runtime only)
      # ============================================================================
      AUTHORITY_KEYPAIR_PATH: /run/secrets/prowallet-authority-keypair.json
      TREASURY_PRIVATE_KEY: ${TREASURY_PRIVATE_KEY:?Set TREASURY_PRIVATE_KEY in .env.docker}

      # ============================================================================
      # PROGRAM CONFIGURATION & IDL ARTIFACTS
      # ============================================================================
      PROWALLET_PROGRAM_ID: 7sa2XazRU4R6DcsNLGMWcX4nabCzWwjj3Awfh1gxhtem
      PROWALLET_IDL: /app/apps/api/idl/prowallet_contract.json
      IDL_PROWALLET_CONTRACT: /app/apps/api/idl/prowallet_contract.json
      IDL_PROWALLET_DEVNET: /app/apps/api/idl/prowallet_contract.devnet.json

      # ============================================================================
      # TOKEN CONFIGURATION (ALIAS for compatibility)
      # ============================================================================
      TOKEN_MINT_ADDRESS: D8TwbwGGmyucrxPB9uscait27caVgeqYHPpyN3XXjUX3

      # ============================================================================
      # JWT AUTHENTICATION
      # ============================================================================
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.docker}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?Set JWT_REFRESH_SECRET in .env.docker}

      # ============================================================================
      # API CONFIGURATION
      # ============================================================================
      API_VERSION: v1
      API_PREFIX: /api
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3006}

      # ============================================================================
      # RATE LIMITING
      # ============================================================================
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 900000
      PURCHASE_RATE_LIMIT_MAX: 900000
      PURCHASE_RATE_LIMIT_WINDOW_MS: 900000

      # ============================================================================
      # PURCHASE LIMITS
      # ============================================================================
      MIN_PURCHASE_AMOUNT: "0.000000001"
      MAX_PURCHASE_AMOUNT: 10000

      # ============================================================================
      # EXCHANGE & PRICING
      # ============================================================================
      EXCHANGE_PROVIDER_URL: https://api.coingecko.com/api/v3/coins/markets
      EXCHANGE_IDS: bitcoin,ethereum,solana,cardano,polkadot,chainlink,uniswap,litecoin,ripple,polygon
      EXCHANGE_VS_CURRENCIES: usd,eur,gbp
      EXCHANGE_TIMEOUT_MS: 7000
      EXCHANGE_MAX_RETRIES: 3

      # ============================================================================
      # FEATURE FLAGS & TESTING
      # ============================================================================
      TEST_MODE_FREE_TOKEN: "false"
      MOCK_TOKEN_INFO: "false"
      ALLOW_OFFCHAIN_LINK: "true"
      WHITELIST_ENABLED: "true"
      SKIP_MINT_ON_CONFIRM: "false"

      # ============================================================================
      # LOGGING
      # ============================================================================
      LOG_LEVEL: info

      # Redis connection
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    ports:
      - "3005:3001"
    networks:
      - prowallet-network
    volumes:
      - ./logs:/app/logs
      - "${AUTHORITY_KEYPAIR_HOST_PATH:?Set AUTHORITY_KEYPAIR_HOST_PATH in .env.docker}:/run/secrets/prowallet-authority-keypair.json:ro"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  prowallet-network:
    driver: bridge
